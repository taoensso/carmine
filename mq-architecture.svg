<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 680" width="1060" height="680" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title>Carmine message queue: message status lifecycle</title>

  <!--
    Hand-written, edit as text. Layout is a simple grid:
      Columns (x centre): 100 (nil), 340 (queued), 610 (locked), 880 (done)
      Rows    (y centre): 150, 290, 430
    Edge/label classes: producer (enqueue, cancel), worker, handler (result), time (expiry).
    Keep in sync with `msg-status-fn.lua` and the status docs in the message queue namespaces.
  -->

  <defs>
    <style>
      .bg       { fill: #ffffff; }
      .node     { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
      .status   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #24292f; text-anchor: middle; }
      .title    { font-size: 16px; font-weight: 600; fill: #24292f; }
      .note     { fill: #57606a; }
      .edge     { fill: none; stroke-width: 1.5; }
      .producer { stroke: #0969da; } text.producer, tspan.producer { fill: #0969da; stroke: none; }
      .worker   { stroke: #57606a; } text.worker,   tspan.worker   { fill: #57606a; stroke: none; }
      .handler  { stroke: #1a7f37; } text.handler,  tspan.handler  { fill: #1a7f37; stroke: none; }
      .time     { stroke: #bc4c00; } text.time,     tspan.time     { fill: #bc4c00; stroke: none; }
      .cancel   { fill: #ffffff; stroke: #0969da; stroke-width: 1.5; }
      .cancel-x { fill: #0969da; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .mid      { text-anchor: middle; }
      .end      { text-anchor: end; }
    </style>
    <marker id="arrow-producer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="arrow-worker"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="arrow-handler"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arrow-time"     viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1060" height="680"/>
  <text class="title" x="40" y="30">Carmine message queue: message status lifecycle</text>

  <!-- Edges -->

  <!-- nil -> :queued -->
  <path class="edge producer" marker-end="url(#arrow-producer)" d="M160,290 H245"/>
  <text class="producer mid" x="202" y="282">enqueue</text>

  <!-- nil -> :queued-with-backoff -->
  <path class="edge producer" marker-end="url(#arrow-producer)" d="M125,264 V150 H245"/>
  <text class="producer mid" x="185" y="128">enqueue with</text>
  <text class="producer mid" x="185" y="142">:init-backoff-ms</text>

  <!-- :queued-with-backoff -> :queued -->
  <path class="edge time" marker-end="url(#arrow-time)" d="M340,176 V264"/>
  <text class="time" x="348" y="224">backoff expires</text>

  <!-- :queued -> :locked -->
  <path class="edge worker" marker-end="url(#arrow-worker)" d="M435,278 H515"/>
  <text class="worker mid" x="475" y="270">dequeue</text>

  <!-- :locked -> :queued -->
  <path class="edge handler" marker-end="url(#arrow-handler)" d="M515,304 H435"/>
  <text class="handler mid" x="475" y="322">:retry</text>
  <text class="time mid" x="475" y="336">lock expires</text>

  <!-- :locked -> :queued-with-backoff -->
  <path class="edge handler" marker-end="url(#arrow-handler)" d="M545,264 L437,172"/>
  <text class="handler" x="505" y="212">:retry with</text>
  <text class="handler" x="505" y="226">:backoff-ms</text>

  <!-- :locked -> :locked-with-requeue -->
  <path class="edge producer" marker-end="url(#arrow-producer)" d="M610,316 V404"/>
  <text class="producer" x="618" y="356">enqueue with</text>
  <text class="producer" x="618" y="370">:can-requeue?</text>

  <!-- :locked -> :done-awaiting-gc -->
  <path class="edge handler" marker-end="url(#arrow-handler)" d="M705,290 H785"/>
  <text class="handler mid" x="745" y="282">:success</text>
  <text class="handler mid" x="745" y="306">:error ¹</text>
  <text class="worker mid"  x="745" y="320">give up ²</text>

  <!-- :locked -> :done-with-backoff -->
  <path class="edge handler" marker-end="url(#arrow-handler)" d="M680,264 L799,178"/>
  <text class="handler end" x="722" y="205">:success with</text>
  <text class="handler end" x="722" y="219">:backoff-ms</text>

  <!-- :done-with-backoff -> :done-awaiting-gc -->
  <path class="edge time" marker-end="url(#arrow-time)" d="M880,176 V264"/>
  <text class="time" x="888" y="224">backoff expires</text>

  <!-- :done-* -> :done-with-requeue -->
  <path class="edge producer" marker-end="url(#arrow-producer)" d="M880,316 V404"/>
  <text class="producer" x="888" y="364">enqueue ³</text>

  <!-- :locked-with-requeue -> :done-with-requeue -->
  <path class="edge handler" marker-end="url(#arrow-handler)" d="M705,430 H785"/>
  <text class="handler mid" x="745" y="408">handler</text>
  <text class="handler mid" x="745" y="422">done</text>

  <!-- :done-with-requeue -> :queued -->
  <path class="edge worker" marker-end="url(#arrow-worker)" d="M880,456 V510 H340 V316"/>
  <text class="worker mid" x="610" y="502">requeue, once any backoff expires</text>

  <!-- :done-awaiting-gc -> nil -->
  <path class="edge worker" marker-end="url(#arrow-worker)" d="M975,290 H1020 V70 H75 V264"/>
  <text class="worker mid" x="560" y="62">garbage collect</text>

  <!-- Nodes -->

  <rect class="node" x="40"  y="264" width="120" height="52" rx="8"/>
  <text class="status" x="100" y="287">nil</text>
  <text class="note mid" x="100" y="303" font-size="11">(not in queue)</text>

  <rect class="node" x="245" y="124" width="190" height="52" rx="8"/>
  <text class="status" x="340" y="155">:queued-with-backoff</text>

  <rect class="node" x="245" y="264" width="190" height="52" rx="8"/>
  <text class="status" x="340" y="295">:queued</text>

  <rect class="node" x="515" y="264" width="190" height="52" rx="8"/>
  <text class="status" x="610" y="295">:locked</text>

  <rect class="node" x="515" y="404" width="190" height="52" rx="8"/>
  <text class="status" x="610" y="435">:locked-with-requeue</text>

  <rect class="node" x="785" y="124" width="190" height="52" rx="8"/>
  <text class="status" x="880" y="155">:done-with-backoff</text>

  <rect class="node" x="785" y="264" width="190" height="52" rx="8"/>
  <text class="status" x="880" y="295">:done-awaiting-gc</text>

  <rect class="node" x="785" y="404" width="190" height="52" rx="8"/>
  <text class="status" x="880" y="435">:done-with-requeue</text>

  <!-- Cancel badges: statuses that `cancel` acts on -->
  <g>
    <circle class="cancel" cx="435" cy="124" r="9"/><text class="cancel-x" x="435" y="128">✕</text>
    <circle class="cancel" cx="435" cy="264" r="9"/><text class="cancel-x" x="435" y="268">✕</text>
    <circle class="cancel" cx="705" cy="264" r="9"/><text class="cancel-x" x="705" y="268">✕</text>
    <circle class="cancel" cx="705" cy="404" r="9"/><text class="cancel-x" x="705" y="408">✕</text>
    <circle class="cancel" cx="975" cy="404" r="9"/><text class="cancel-x" x="975" y="408">✕</text>
  </g>

  <!-- Legend -->
  <g>
    <path class="edge producer" marker-end="url(#arrow-producer)" d="M40,556 H76"/>
    <text class="producer" x="84" y="560">producer (enqueue)</text>
    <path class="edge worker" marker-end="url(#arrow-worker)" d="M230,556 H266"/>
    <text class="worker" x="274" y="560">worker</text>
    <path class="edge handler" marker-end="url(#arrow-handler)" d="M350,556 H386"/>
    <text class="handler" x="394" y="560">handler result</text>
    <path class="edge time" marker-end="url(#arrow-time)" d="M510,556 H546"/>
    <text class="time" x="554" y="560">time</text>
    <circle class="cancel" cx="622" cy="556" r="9"/><text class="cancel-x" x="622" y="560">✕</text>
    <text class="producer" x="638" y="560">cancel: drops pending handling and/or requeue, message is then done</text>
  </g>

  <!-- Notes -->
  <g class="note">
    <text x="40" y="592">¹ Retried instead (like :retry) when the worker has :error-retry-backoff-ms.</text>
    <text x="40" y="610">² Worker has :max-attempts and the message still needs a retry. Calls :on-give-up first.</text>
    <text x="40" y="628">³ Needs :can-requeue? while the message is :done-with-backoff.</text>
    <text x="40" y="652">A handler whose lock expired (and message was taken again) or whose message was cancelled is fenced: its result is ignored.</text>
  </g>
</svg>
